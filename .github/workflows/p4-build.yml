name: ESP32-P4 offline slice

on:
  pull_request:
    paths:
      - ".github/workflows/p4-build.yml"
      - "CMakeLists.txt"
      - "main/**"
      - "sdkconfig.defaults"
      - "dependencies.lock"
      - "tests/**"
      - "tools/**"
  workflow_dispatch:

concurrency:
  group: launchpad-p4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static guard tests
        run: python3 -m unittest discover -s tests -v
      - name: Native credential and DST tests
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -I main \
             main/credentials.c main/clock_util.c tests/test_credentials_clock.c \
             -o /tmp/launchpad-clock-test
          /tmp/launchpad-clock-test
      - name: Native SSID display UTF-8 fallback tests
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -I main \
             main/wifi_text.c tests/test_wifi_text.c -o /tmp/launchpad-wifi-text-test
          /tmp/launchpad-wifi-text-test
      - name: Native agenda model and source-selection tests
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -I main \
             main/agenda_model.c tests/test_agenda_model.c -o /tmp/launchpad-agenda-test
          /tmp/launchpad-agenda-test
      - name: Native concurrent agenda store tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pthread -I main -I tests/stubs \
             main/agenda_model.c main/agenda_store.c \
             tests/stubs/freertos_semphr.c tests/test_agenda_store.c \
             -o /tmp/launchpad-agenda-store-test
          /tmp/launchpad-agenda-store-test
      - name: Native agenda store tests under ThreadSanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -g -O1 -fsanitize=thread -pthread \
             -I main -I tests/stubs main/agenda_model.c main/agenda_store.c \
             tests/stubs/freertos_semphr.c tests/test_agenda_store.c \
             -o /tmp/launchpad-agenda-store-tsan
          # High-entropy ASLR on current runner kernels breaks TSan's memory
          # layout; run this one binary with randomization disabled.
          setarch "$(uname -m)" -R env TSAN_OPTIONS=halt_on_error=1 \
             /tmp/launchpad-agenda-store-tsan
      - name: Native fictional agenda provider, DST and store tests
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -pthread \
             -I main -I tests/stubs main/clock_util.c main/agenda_model.c \
             main/agenda_store.c main/agenda_demo.c \
             tests/stubs/freertos_semphr.c tests/test_agenda_demo.c \
             -o /tmp/launchpad-agenda-demo-test
          /tmp/launchpad-agenda-demo-test
      - name: Native agenda presentation and freshness tests
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -pthread \
             -I main -I tests/stubs main/clock_util.c main/agenda_model.c \
             main/agenda_store.c main/agenda_demo.c main/agenda_view.c \
             tests/stubs/freertos_semphr.c tests/test_agenda_view.c \
             -o /tmp/launchpad-agenda-view-test
          /tmp/launchpad-agenda-view-test
      - name: ESP-IDF v6.0.3 / ESP32-P4 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.3
          target: esp32p4
          path: "."
      - name: Verify resolved C5 SDIO build and partition fit
        if: success()
        run: python3 tools/check_c5_build.py
      - name: Show exact dependency resolution
        if: success()
        run: cat dependencies.lock
      - name: Retain build and flash arguments for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: launchpad-p4-offline-${{ github.event.pull_request.head.sha || github.sha }}
          # launchpad.elf/.map are never flashed; they let a task-watchdog or
          # panic backtrace from this exact image be decoded (issue #37).
          path: |
            build/launchpad.bin
            build/launchpad.elf
            build/launchpad.map
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            dependencies.lock
          if-no-files-found: error
          retention-days: 14
